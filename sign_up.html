<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>
    <link rel="stylesheet" href="sign_up.css">
</head>
<body>
    <h4>~Kaushal Kumar</h4>
    <div class="container">
        <div class="boxes">
            <h1>SIGN UP</h1>
            <div class="box">
                <label for="name">Name:</label>
                <input id="name" type="text" placeholder="Enter your name">
            </div>
            <div class="box">
                <label for="mobNo">Phone No:</label>
                <input id="mobNo" type="number" placeholder="0123456789">
            </div>
            <div class="box">
                <label for="mail">Mail Id:</label>
                <input id="mail" type="text" placeholder="abc@gmail.com">
            </div>
            <div class="box">
                <label for="age">Age:</label>
                <input id="age" type="number" placeholder="age">
            </div>
            <div class="box">
                <label for="pass">Password:</label>
                <input id="pass" type="text" placeholder="include @/#/$/ etc.">
            </div>
            <div class="box5">
                <div class="for">
                    <a href="">Forget Password</a>
                </div>
                <button id="sub">
                    <a href="">SUBMIT</a>
                </button>
                <div class="sign">
                    <a href="index.html">Login</a>
                </div>
            </div>
        </div>
    </div>
    <script src="sign_up.js"></script>
</body>
</html>
