<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="login1.css">
</head>
<body>
    <h4>~Kaushal Kumar</h4>
    <div class="container">
        
        <div class="boxes">
            <h1>LOGIN</h1> 
            <select name="dropdown" id="drop">
                <option class="op" value="admin">Admin</option>
                <option class="op" value="student">Student</option>
            </select>
            <div class="box">
                <label for="name">Name:</label>
                <input id="name" type="text" placeholder="Enter your name">
            </div>
            <div class="box">
                <label for="mobNo">Phone No:</label>
                <input id="mobNo" type="number" placeholder="0123456789">
            </div>
            <div class="box">
                <label for="pass">Password:</label>
                <input id="pass" type="text" placeholder="include @/#/$/ etc.">
            </div>
            <div class="box5">
                <div class="for">
                    <a href="">Forget Password</a>
                </div>
                <button id="sub">
                    <a href=""> SUBMIT</a>
                </button>
                <div class="sign">
                    <a href="sign_up.html">Sign Up</a>
                </div>
            </div>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
